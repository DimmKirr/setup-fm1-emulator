name: Example – E2E firmware UI tests

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - firmware: felucca
            url: https://thefirmwarehub.com/fw/felucca-1.6.1.fwsc
          - firmware: sloop
            url: https://thefirmwarehub.com/fw/sloop-2.6.fwsc
          - firmware: melodee
            url: https://thefirmwarehub.com/fw/melodee-1.3.6.fwsc

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup fm1-emu
        id: emu
        uses: ./

      - name: Run E2E test
        id: e2e
        continue-on-error: true
        env:
          FM1_WEB_DIR: ${{ steps.emu.outputs.web-path }}
          FIRMWARE_NAME: ${{ matrix.firmware }}
          FIRMWARE_URL: ${{ matrix.url }}
          RESULTS_DIR: results
        run: |
          set -o pipefail
          python3 -m unittest examples.e2e_firmware_ui_test -v 2>&1 \
            | tee e2e-output.txt

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.firmware }}
          path: results/${{ matrix.firmware }}/screenshots/
          retention-days: 14

      - name: Post screenshots to summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.firmware }}"
            echo ""
            for png in results/${{ matrix.firmware }}/screenshots/*.png; do
              [ -f "$png" ] || continue
              name=$(basename "$png" .png)
              label=$(echo "$name" | sed "s/^${{ matrix.firmware }}-//" | tr '_-' '  ')
              b64=$(base64 -w 0 "$png")
              echo "### $label"
              echo ""
              echo "<img src=\"data:image/png;base64,$b64\" width=\"800\" alt=\"${{ matrix.firmware }} $label\">"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if tests failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
