name: Weekly firmware E2E screenshots

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  felucca:
    uses: ./.github/workflows/_e2e-firmware.yml
    with:
      firmware-name: felucca
      firmware-url: https://thefirmwarehub.com/fw/felucca-1.6.1.fwsc

  sloop:
    uses: ./.github/workflows/_e2e-firmware.yml
    with:
      firmware-name: sloop
      firmware-url: https://thefirmwarehub.com/fw/sloop-2.6.fwsc

  melodee:
    uses: ./.github/workflows/_e2e-firmware.yml
    with:
      firmware-name: melodee
      firmware-url: https://thefirmwarehub.com/fw/melodee-1.3.6.fwsc

  summary:
    needs: [felucca, sloop, melodee]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download all screenshots
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: e2e-*

      - name: Generate status page with base64 screenshots
        run: |
          {
            echo "# Weekly Firmware E2E Screenshots"
            echo ""
            echo "| Firmware | Status |"
            echo "|----------|--------|"
            echo "| Felucca | ${{ needs.felucca.result == 'success' && ':white_check_mark:' || ':x:' }} |"
            echo "| SLOOP | ${{ needs.sloop.result == 'success' && ':white_check_mark:' || ':x:' }} |"
            echo "| Melodee | ${{ needs.melodee.result == 'success' && ':white_check_mark:' || ':x:' }} |"
            echo ""

            for fw_dir in all-results/e2e-*/; do
              fw=$(basename "$fw_dir" | sed 's/^e2e-//')
              screenshots_dir="$fw_dir/$fw/screenshots"
              [ -d "$screenshots_dir" ] || continue

              echo "## $fw"
              echo ""
              for png in "$screenshots_dir"/*.png; do
                [ -f "$png" ] || continue
                name=$(basename "$png" .png)
                label=$(echo "$name" | sed "s/^${fw}-//" | tr '-_' '  ')
                b64=$(base64 -w 0 "$png")
                echo "### $label"
                echo ""
                echo "<img src=\"data:image/png;base64,$b64\" width=\"800\" alt=\"$fw $label\">"
                echo ""
              done

              log="$fw_dir/$fw/emulator.log"
              if [ -f "$log" ]; then
                echo "<details><summary>Emulator log</summary>"
                echo ""
                echo '```'
                head -50 "$log"
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
