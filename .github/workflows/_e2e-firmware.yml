name: E2E firmware test (reusable)

on:
  workflow_call:
    inputs:
      firmware-name:
        required: true
        type: string
      firmware-url:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup fm1-emu
        id: emu
        uses: ./

      - name: Install Playwright
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Run E2E test
        id: e2e
        continue-on-error: true
        env:
          FM1_EMU_SOURCE: ${{ steps.emu.outputs.source-path }}
          FIRMWARE_NAME: ${{ inputs.firmware-name }}
          FIRMWARE_URL: ${{ inputs.firmware-url }}
          RESULTS_DIR: results
        run: |
          set -o pipefail
          python3 -m unittest examples.e2e_firmware_test -v 2>&1 \
            | tee e2e-output.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ inputs.firmware-name }}
          path: results/
          retention-days: 14

      - name: Fail if tests failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
